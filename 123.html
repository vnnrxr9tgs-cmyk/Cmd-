<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бегущий волк</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            overflow: hidden;
        }

        /* Контейнер для волка */
        .wolf-container {
            position: fixed;
            top: var(--wolf-top, 120px);
            left: 0;
            width: 100vw;
            height: 120px;
            z-index: 1000;
            pointer-events: none;
        }

        .wolf-runner {
            position: absolute;
            left: -180px;
            width: 180px;
            height: 100px;
        }

        /* Стили волка - упрощенный и улучшенный */
        .wolf {
            width: 180px;
            height: 100px;
            filter: drop-shadow(0 5px 20px rgba(0, 0, 0, 0.8));
        }

        /* Диалоговое окно */
        .speech-bubble {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 10px 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
            min-width: 120px;
            text-align: center;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.95);
        }

        /* Анимация ног - более плавная */
        .leg {
            transform-origin: top center;
        }

        .leg1 { animation: leg1Move 0.3s infinite alternate; }
        .leg2 { animation: leg2Move 0.3s infinite alternate; }
        .leg3 { animation: leg3Move 0.3s infinite alternate; }
        .leg4 { animation: leg4Move 0.3s infinite alternate; }

        @keyframes leg1Move {
            0% { transform: translateY(0) rotate(10deg); }
            100% { transform: translateY(-12px) rotate(-10deg); }
        }

        @keyframes leg2Move {
            0% { transform: translateY(-8px) rotate(-8deg); }
            100% { transform: translateY(4px) rotate(8deg); }
        }

        @keyframes leg3Move {
            0% { transform: translateY(-4px) rotate(4deg); }
            100% { transform: translateY(8px) rotate(-6deg); }
        }

        @keyframes leg4Move {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-10px) rotate(8deg); }
        }

        /* Анимация тела */
        .wolf-body {
            animation: bodyBounce 0.8s infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes bodyBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* Анимация хвоста */
        .tail {
            transform-origin: 50% 20%;
            animation: tailWag 0.8s infinite alternate;
        }

        @keyframes tailWag {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        /* Класс для паузы анимаций */
        .paused .leg1,
        .paused .leg2,
        .paused .leg3,
        .paused .leg4,
        .paused .wolf-body,
        .paused .tail {
            animation-play-state: paused;
        }
    </style>
</head>
<body>
    <!-- Контейнер для волка -->
    <div class="wolf-container">
        <div class="wolf-runner" id="wolfRunner">
            <!-- Диалоговое окно -->
            <div class="speech-bubble" id="speechBubble"></div>

            <!-- SVG волка - упрощенный и улучшенный -->
            <svg class="wolf" viewBox="0 0 200 100">
                <!-- Тело с градиентом - более обтекаемая форма -->
                <ellipse class="wolf-body" cx="100" cy="60" rx="50" ry="28" fill="url(#bodyGradient)" />

                <!-- Градиент для тела -->
                <defs>
                    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#5a6c7e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#3a4a5a;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6a7c8e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#4a5a6a;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Голова - более плавная форма -->
                <ellipse cx="150" cy="50" rx="25" ry="20" fill="url(#headGradient)" />

                <!-- Морда - уменьшенная -->
                <ellipse cx="170" cy="50" rx="12" ry="8" fill="#b5c1d2" />

                <!-- Нос - немного уменьшен чтобы соответствовать морде -->
                <ellipse cx="177" cy="50" rx="4" ry="3" fill="#2c3e50" />

                <!-- Уши - толще у основания -->
                <path d="M138,30 L128,12 L132,35"
                      fill="#4a5a6a"
                      stroke="#3a4a5a"
                      stroke-width="1.5" />
                <path d="M162,30 L172,12 L168,35"
                      fill="#4a5a6a"
                      stroke="#3a4a5a"
                      stroke-width="1.5" />

                <!-- Внутренняя часть ушей - расширена у основания -->
                <path d="M136,32 L130,20 L134,33"
                      fill="#6a7a8a"
                      opacity="0.8" />
                <path d="M164,32 L170,20 L166,33"
                      fill="#6a7a8a"
                      opacity="0.8" />
                <!-- Глаза - простые и выразительные -->
                <ellipse cx="145" cy="48" rx="4" ry="3" fill="#ffffff" />
                <circle cx="145" cy="48" r="2" fill="#2c3e50" />
                <circle cx="144" cy="47" r="0.8" fill="#ffffff" />

                <!-- Ноги - более естественные -->
                <line class="leg leg1" x1="70" y1="78" x2="65" y2="98" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round" />
                <ellipse cx="65" cy="100" rx="4" ry="3" fill="#3a4a5a" />

                <line class="leg leg2" x1="90" y1="78" x2="85" y2="98" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round" />
                <ellipse cx="85" cy="100" rx="4" ry="3" fill="#3a4a5a" />

                <line class="leg leg3" x1="110" y1="78" x2="105" y2="98" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round" />
                <ellipse cx="105" cy="100" rx="4" ry="3" fill="#3a4a5a" />

                <line class="leg leg4" x1="130" y1="78" x2="125" y2="98" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round" />
                <ellipse cx="125" cy="100" rx="4" ry="3" fill="#3a4a5a" />

                <!-- Хвост - увеличенный, смещенный назад и толще -->
                <path class="tail" d="M45,55 Q25,30 5,45 Q0,60 20,70 Q50,78 58,53"
                      fill="#6a7c8e"
                      stroke="#5a6c7e"
                      stroke-width="1" />
            </svg>
        </div>
    </div>

    <script>
        // Набор фраз для диалогового окна
        const phrases = [
            "Где добыча?",
            "Чего смотришь?",
            "Как дела?",
            "Скучно...",
            "Пора охотиться!",
            "Чувствую след...",
            "Ты кто?"
        ];

        // Логика анимации бега волка
        function runWolf() {
            const wolf = document.getElementById('wolfRunner');
            const speechBubble = document.getElementById('speechBubble');

            // Бег вправо (5 секунд)
            wolf.style.transition = 'left 5s linear';
            wolf.style.left = 'calc(100vw - 100px)';

            // После 5 секунд - разворот и бег обратно
            setTimeout(() => {
                wolf.style.transform = 'scaleX(-1)';
                speechBubble.style.transform = 'translateX(-50%) scaleX(-1)';
                wolf.style.transition = 'left 5s linear';
                wolf.style.left = '-180px';

                // Рандомно решаем, останавливаться ли для диалога (50% шанс)
                if (Math.random() > 0.5) {
                    // Остановка на обратном пути
                    setTimeout(() => {
                        const currentLeft = parseFloat(getComputedStyle(wolf).left);
                        wolf.style.transition = 'none';
                        wolf.style.left = currentLeft + 'px';
                        wolf.classList.add('paused');

                        // Показываем фразу
                        const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                        speechBubble.textContent = randomPhrase;
                        speechBubble.style.opacity = '1';

                        // Пауза на 3 секунды
                        setTimeout(() => {
                            speechBubble.style.opacity = '0';
                            wolf.classList.remove('paused');
                            wolf.style.transition = 'left 5s linear';
                            wolf.style.left = '-180px';

                            // После возврата - сброс
                            setTimeout(() => {
                                resetWolf();
                            }, 5000);

                        }, 3000);

                    }, 2500);
                } else {
                    // Просто пробегает обратно
                    setTimeout(() => {
                        resetWolf();
                    }, 5000);
                }

            }, 5000);
        }

        // Сброс состояния волка
        function resetWolf() {
            const wolf = document.getElementById('wolfRunner');
            const speechBubble = document.getElementById('speechBubble');

            wolf.style.opacity = '0';
            wolf.style.transform = 'scaleX(1)';
            speechBubble.style.transform = 'translateX(-50%)';
            wolf.style.transition = 'none';
            wolf.style.left = '-180px';

            // Пауза на 50 секунд
            setTimeout(() => {
                wolf.style.opacity = '1';
                runWolf();
            }, 50000);
        }

        // Запуск при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                runWolf();
            }, 1000);
        });
    </script>
</body>
</html>
