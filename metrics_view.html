<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг сервера</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px; margin: 0 auto; background: white;
            border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px 30px; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .header h1 { font-size: 22px; }
        .nav-links { display: flex; gap: 10px; }
        .nav-link {
            color: white; text-decoration: none; padding: 8px 15px;
            background: rgba(255,255,255,0.2); border-radius: 20px; font-size: 14px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.3); }
        .content { padding: 25px; }

        .auto-refresh {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666; margin-bottom: 20px;
        }

        .system-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
        }
        .sys-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8eaff 100%);
            padding: 30px; border-radius: 15px; text-align: center;
        }
        .sys-card h3 { color: #333; margin-bottom: 15px; font-size: 18px; }
        .sys-ring {
            width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 700; color: #667eea;
            position: relative;
        }
        .sys-ring::before {
            content: ''; position: absolute; width: 96px; height: 96px;
            background: white; border-radius: 50%;
        }
        .sys-ring span { position: relative; z-index: 1; }
        .sys-info { font-size: 14px; color: #666; margin-top: 10px; }
        .sys-info strong { color: #333; }

        .section-title { color: #333; font-size: 18px; margin-bottom: 15px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card {
            background: #f8f9ff; padding: 22px; border-radius: 12px;
            border-left: 4px solid #667eea; transition: all 0.3s;
        }
        .card.critical { border-left-color: #e74c3c; background: #fff5f5; }
        .card.ok { border-left-color: #28a745; }
        .card h3 { color: #333; margin-bottom: 12px; font-size: 16px; }
        .card .metric { font-size: 30px; font-weight: 700; color: #667eea; }
        .card .metric.danger { color: #e74c3c; }
        .card .label { font-size: 12px; color: #999; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .status-badge {
            display: inline-block; padding: 5px 14px; border-radius: 14px;
            font-size: 13px; font-weight: 600; margin-top: 10px;
        }
        .status-active { background: #d4edda; color: #155724; }
        .status-idle { background: #fff3cd; color: #856404; }
        .status-not_responding { background: #f8d7da; color: #721c24; animation: blink 1s infinite; }
        .status-not_found { background: #e0e0e0; color: #666; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .no-data { text-align: center; padding: 60px; color: #999; font-size: 16px; }

        /* ===== АПЕЛЬСИН ===== */
        .orange-scene {
            position: fixed; bottom: 25px; right: 25px; z-index: 9999;
            width: 90px; height: 90px; perspective: 200px;
        }
        .orange {
            width: 100%; height: 100%; position: relative;
            cursor: pointer; transition: transform 0.1s;
        }
        .orange:hover { transform: scale(1.08); }
        .orange:active { transform: scale(0.94); }

        /* Тень */
        .orange-shadow {
            position: absolute; bottom: -8px; left: 10%;
            width: 80%; height: 14px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.25) 0%, transparent 70%);
            border-radius: 50%; transition: all 0.3s;
        }
        .orange:hover .orange-shadow { bottom: -5px; opacity: 0.4; }

        /* Тело */
        .orange-body {
            width: 78px; height: 78px; margin: 6px;
            background: radial-gradient(circle at 38% 32%, #ffcc80 0%, #ffa726 25%, #f57c00 60%, #e65100 100%);
            border-radius: 50%; position: relative;
            box-shadow:
                inset 0 -8px 16px rgba(0,0,0,0.2),
                inset 0 4px 8px rgba(255,255,255,0.15),
                0 6px 20px rgba(230,81,0,0.35);
        }

        /* Текстура кожуры */
        .orange-body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 20% 25%, rgba(255,255,255,0.12) 0%, transparent 30%),
                radial-gradient(circle at 70% 60%, rgba(0,0,0,0.06) 0%, transparent 25%),
                radial-gradient(circle at 45% 40%, rgba(255,255,255,0.08) 0%, transparent 15%);
        }

        /* Поры */
        .orange-body::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 25% 30%, rgba(255,255,255,0.2) 0%, transparent 2%),
                radial-gradient(circle at 60% 25%, rgba(255,255,255,0.15) 0%, transparent 2%),
                radial-gradient(circle at 35% 55%, rgba(255,255,255,0.2) 0%, transparent 1.5%),
                radial-gradient(circle at 70% 50%, rgba(255,255,255,0.18) 0%, transparent 2%),
                radial-gradient(circle at 50% 70%, rgba(255,255,255,0.15) 0%, transparent 1.5%),
                radial-gradient(circle at 30% 45%, rgba(255,255,255,0.2) 0%, transparent 1%),
                radial-gradient(circle at 65% 35%, rgba(255,255,255,0.15) 0%, transparent 1.5%);
        }

        /* Стебель */
        .orange-stem {
            position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 14px;
            background: linear-gradient(to bottom, #5d4037, #4e342e);
            border-radius: 40% 40% 10% 10%;
            z-index: 2;
        }
        .orange-stem::after {
            content: ''; position: absolute; top: 2px; left: -2px;
            width: 4px; height: 5px; background: #795548;
            border-radius: 50%; opacity: 0.5;
        }

        /* Листик */
        .orange-leaf {
            position: absolute; top: -6px; left: 56%;
            width: 20px; height: 11px;
            background: linear-gradient(135deg, #66bb6a, #43a047);
            border-radius: 2px 12px 2px 10px;
            transform: rotate(18deg);
            z-index: 1;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
        }
        .orange-leaf::after {
            content: ''; position: absolute; top: 3px; left: 4px;
            width: 12px; height: 1px; background: rgba(255,255,255,0.3);
            transform: rotate(-5deg);
        }

        /* Блик */
        .orange-highlight {
            position: absolute; top: 12px; left: 16px;
            width: 20px; height: 14px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            transform: rotate(-15deg);
            z-index: 1;
            pointer-events: none;
        }
        .orange-highlight::after {
            content: ''; position: absolute; top: 2px; left: 3px;
            width: 8px; height: 5px; background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        /* Анимация переворота */
        .orange-flip {
            animation: flipAround 0.8s ease-in-out;
        }
        @keyframes flipAround {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Покачивание */
        .orange-idle {
            animation: idleSway 4s ease-in-out infinite;
        }
        @keyframes idleSway {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            15% { transform: translateY(-6px) rotate(-2deg); }
            30% { transform: translateY(-2px) rotate(1deg); }
            45% { transform: translateY(-7px) rotate(-1deg); }
            60% { transform: translateY(-3px) rotate(2deg); }
            75% { transform: translateY(-5px) rotate(0deg); }
            90% { transform: translateY(-1px) rotate(-1deg); }
        }

        @media (max-width: 768px) {
            .system-bar { grid-template-columns: 1fr; }
            .cards { grid-template-columns: 1fr; }
            .orange-scene { bottom: 15px; right: 15px; width: 70px; height: 70px; }
            .orange-body { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Мониторинг сервера</h1>
            <div class="nav-links">
                <a href="/documents" class="nav-link">📁 Документы</a>
                <a href="/" class="nav-link">🏠 Главная</a>
            </div>
        </div>

        <div class="content">
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAuto()">
                <span>Автообновление (2 сек)</span>
                <span id="lastUpdate" style="margin-left:10px;color:#999;"></span>
            </div>

            <div class="system-bar">
                <div class="sys-card">
                    <h3>🖥️ Процессор</h3>
                    <div class="sys-ring" id="cpuRing"><span>0%</span></div>
                    <div class="sys-info">Ядер: <strong id="cpuCores">-</strong> | Частота: <strong id="cpuFreq">-</strong> МГц</div>
                </div>
                <div class="sys-card">
                    <h3>💾 Память</h3>
                    <div class="sys-ring" id="ramRing"><span>0%</span></div>
                    <div class="sys-info">Использовано: <strong id="ramUsed">-</strong> / <strong id="ramTotal">-</strong> МБ</div>
                </div>
            </div>

            <h3 class="section-title">📋 Процессы</h3>
            <div class="cards" id="processCards">
                <div class="card"><h3>⏳ Загрузка...</h3></div>
            </div>
        </div>
    </div>

    <!-- Апельсин -->
    <div class="orange-scene">
        <div class="orange idle" id="orange" onclick="flipOrange()">
            <div class="orange-shadow"></div>
            <div class="orange-stem"></div>
            <div class="orange-leaf"></div>
            <div class="orange-body"></div>
            <div class="orange-highlight"></div>
        </div>
    </div>

    <script>
        let autoRefresh = true;
        let metricsTimer = null;
        let flipTimer = null;

        // ============================================
        // АПЕЛЬСИН
        // ============================================
        function flipOrange() {
            const orange = document.getElementById('orange');
            if (orange.classList.contains('flipping')) return;

            orange.classList.add('flipping');
            orange.classList.remove('orange-idle');
            orange.classList.add('orange-flip');

            setTimeout(() => {
                orange.classList.remove('orange-flip', 'flipping');
                orange.classList.add('orange-idle');
                scheduleAutoFlip();
            }, 800);
        }

        function scheduleAutoFlip() {
            clearTimeout(flipTimer);
            flipTimer = setTimeout(() => {
                flipOrange();
            }, 20000);
        }

        // ============================================
        // МОНИТОРИНГ
        // ============================================
        async function loadLatest() {
            try {
                const r = await fetch('/api/metrics/latest');
                const d = await r.json();
                const sys = d.system || {};
                const procs = d.processes || [];
                const now = new Date().toLocaleTimeString();

                updateRing('cpuRing', sys.cpu_total || 0);
                updateRing('ramRing', sys.ram_total_percent || 0);
                document.getElementById('cpuCores').textContent = sys.cpu_cores || '-';
                document.getElementById('cpuFreq').textContent = sys.cpu_freq || '-';
                document.getElementById('ramUsed').textContent = sys.ram_used_mb || '-';
                document.getElementById('ramTotal').textContent = sys.ram_total_mb || '-';

                const container = document.getElementById('processCards');
                if (!procs.length) {
                    container.innerHTML = '<div class="no-data">Нет данных о процессах</div>';
                } else {
                    container.innerHTML = procs.map(p => {
                        const statusText = {
                            'active': '✅ Активен',
                            'idle': '💤 Ожидание',
                            'not_responding': '❌ Не отвечает',
                            'not_found': '⚫ Не запущен'
                        }[p.status] || p.status;
                        const cardClass = p.status === 'not_responding' ? 'critical' :
                                         p.status === 'not_found' ? '' : 'ok';
                        const ramPct = sys.ram_total_mb > 0 ? (p.memory_mb / sys.ram_total_mb * 100).toFixed(1) : 0;

                        return `<div class="card ${cardClass}">
                            <h3>🖥️ ${p.process_name}</h3>
                            <div class="metric ${p.cpu_percent > 80 ? 'danger' : ''}">${p.cpu_percent}%</div>
                            <div class="label">CPU</div>
                            <div class="metric" style="margin-top:12px;">${p.memory_mb} MB</div>
                            <div class="label">RAM (${ramPct}% от всей)</div>
                            <div class="metric" style="font-size:15px;margin-top:12px;">${fmtUptime(p.uptime_seconds)}</div>
                            <div class="label">Аптайм</div>
                            <span class="status-badge status-${p.status}">${statusText}</span>
                        </div>`;
                    }).join('');
                }

                document.getElementById('lastUpdate').textContent = 'Обновлено: ' + now;
            } catch(e) {}
        }

        function updateRing(id, pct) {
            const el = document.getElementById(id);
            el.querySelector('span').textContent = pct + '%';
            el.style.background = `conic-gradient(${pct > 80 ? '#e74c3c' : '#667eea'} ${pct}%, #e0e0e0 0)`;
        }

        function fmtUptime(s) {
            if (!s) return '—';
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
            return h > 0 ? `${h}ч ${m}м` : `${m}м ${s % 60}с`;
        }

        function toggleAuto() {
            autoRefresh = document.getElementById('autoRefresh').checked;
            if (autoRefresh) startMetricsTimer();
            else clearInterval(metricsTimer);
        }

        function startMetricsTimer() {
            clearInterval(metricsTimer);
            loadLatest();
            metricsTimer = setInterval(loadLatest, 2000);
        }

        // ============================================
        // СТАРТ
        // ============================================
        startMetricsTimer();
        scheduleAutoFlip();
    </script>
</body>
</html>
