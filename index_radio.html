<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>104.8 FM — Лёгкое радио</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #e0f0ff 0%, #c8e2f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        /* главная карточка */
        .radio-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            padding: 2rem 1.8rem;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        /* Блюр только для карточки при открытом модальном окне */
        .radio-card.blur-active {
            filter: blur(3px);
        }

        /* Анимация подключения */
        .radio-card.connecting {
            background: linear-gradient(45deg, #f0f8ff, #e6f3ff, #f0f8ff);
            background-size: 200% 200%;
            animation: connectingBg 2s ease-in-out infinite;
        }

        @keyframes connectingBg {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .frequency {
            font-size: 5rem;
            font-weight: 700;
            color: #1a6fa8;
            line-height: 1;
            margin-bottom: 0.25rem;
            transition: all 0.3s ease;
        }

        .fm-label {
            font-size: 1.2rem;
            color: #4a8bbf;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 0.9rem;
            color: #6b9fc4;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #cde3f5;
            display: inline-block;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
            border: none;
            padding: 0.7rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-play {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.4);
            min-width: 140px;
            font-size: 1.1rem;
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #0d6ebd, #0f4d92);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.5);
        }

        .btn-play:active {
            transform: translateY(0);
        }

        .btn-play.connecting {
            background: linear-gradient(135deg, #ffb74d, #ff9800);
            box-shadow: 0 4px 12px rgba(255, 183, 77, 0.4);
            cursor: wait;
        }

        .btn-play.connecting:hover {
            transform: none;
            box-shadow: 0 4px 12px rgba(255, 183, 77, 0.4);
        }

        /* Статусы */
        .status-container {
            margin: 1.5rem 0;
        }

        .playing-indicator {
            display: none;
            color: #1e88e5;
            font-weight: 700;
            font-size: 1.2rem;
            margin: 1rem 0;
            padding: 0.8rem 1.2rem;
            background: rgba(30, 136, 229, 0.1);
            border-radius: 1.5rem;
            border: 1px solid rgba(30, 136, 229, 0.2);
            animation: playingPulse 2s infinite;
        }

        .playing-indicator.active {
            display: block;
        }

        @keyframes playingPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(30, 136, 229, 0.4);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 0 10px rgba(30, 136, 229, 0);
            }
        }

        .status-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #5a8fb5;
            margin-top: 0.5rem;
            min-height: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #b8d4ec;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .status-dot.connecting {
            background: #ffb74d;
            animation: connectingPulse 1.5s infinite;
        }

        .status-dot.active {
            background: #1e88e5;
            animation: activePulse 1.5s infinite;
        }

        @keyframes connectingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        @keyframes activePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .status-dot.error {
            background: #ef5350;
            animation: errorPulse 1.5s infinite;
        }

        @keyframes errorPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .about-btn {
            margin-top: 1.8rem;
            background: none;
            border: none;
            font-size: 0.8rem;
            color: #7aabce;
            cursor: pointer;
            text-decoration: underline;
            transition: 0.2s;
        }

        .about-btn:hover {
            color: #1a6fa8;
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            max-width: 340px;
            width: 85%;
            padding: 2rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 1001;
            transform: scale(1);
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-content h3 {
            font-size: 1.5rem;
            color: #1a6fa8;
            margin-bottom: 1rem;
        }

        .modal-content p {
            color: #5a8fb5;
            line-height: 1.5;
            margin: 0.8rem 0;
            font-size: 0.9rem;
        }

        .close-modal {
            margin-top: 1.5rem;
            background: #e0f0ff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            color: #1a6fa8;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: #cce5ff;
            transform: translateY(-1px);
        }

        @media (max-width: 500px) {
            .radio-card {
                padding: 1.5rem;
            }
            .frequency {
                font-size: 3.5rem;
            }
            button {
                padding: 0.6rem 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="radio-card" id="radioCard">
    <div class="frequency">104,8</div>
    <div class="fm-label">FM</div>
    <div class="tagline">🎵 лёгкая волна</div>

    <div class="controls">
        <button class="btn-play" id="playBtn">▶ Подключиться</button>
    </div>

    <div class="status-container">
        <div class="playing-indicator" id="playingIndicator">
            🎵 Играет 104.8 FM
        </div>

        <div class="status-area">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Готов к прослушиванию</span>
        </div>
    </div>

    <button class="about-btn" id="aboutBtn">📻 О проекте</button>
</div>

<!-- Модальное окно -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <h3>📻 104.8 FM</h3>
        <p>Лёгкое радио — ваш островок спокойствия.</p>
        <p>Мы транслируем приятную музыку и создаём уютную атмосферу 24/7.</p>
        <p>Потоковое вещание с минимальной задержкой.</p>
        <button class="close-modal" id="closeModalBtn">Закрыть</button>
    </div>
</div>

<script>
    (function() {
        // Элементы интерфейса
        const playBtn = document.getElementById('playBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const playingIndicator = document.getElementById('playingIndicator');
        const aboutBtn = document.getElementById('aboutBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const radioCard = document.getElementById('radioCard');

        let audio = null;
        let isPlaying = false;
        let isConnecting = false;

        // Функция обновления статуса
        function updateStatus(state, message, dotClass = '') {
            statusText.textContent = message;

            // Убираем все классы
            statusDot.className = 'status-dot';
            radioCard.classList.remove('connecting');
            playBtn.classList.remove('connecting');

            if (state === 'connecting') {
                statusDot.classList.add('connecting');
                radioCard.classList.add('connecting');
                playBtn.classList.add('connecting');
                statusText.style.color = '#ffb74d';
            } else if (state === 'playing') {
                statusDot.classList.add('active');
                statusText.style.color = '#1e88e5';
                playingIndicator.classList.add('active');
            } else if (state === 'error') {
                statusDot.classList.add('error');
                statusText.style.color = '#ef5350';
                playingIndicator.classList.remove('active');
            } else {
                statusDot.classList.remove('active', 'connecting', 'error');
                statusText.style.color = '#5a8fb5';
                playingIndicator.classList.remove('active');
            }
        }

        // Полная остановка
        function stopPlay() {
            if (audio) {
                audio.pause();
                audio.src = '';
                audio = null;
            }
            isPlaying = false;
            isConnecting = false;
            playBtn.textContent = '▶ Подключиться';
            updateStatus('ready', 'Готов к прослушиванию');
        }

        // Запуск воспроизведения
        function startPlay() {
            if (isConnecting || isPlaying) return;

            isConnecting = true;
            playBtn.textContent = '⏳ Подключение...';
            updateStatus('connecting', 'Подключение к серверу...');

            // Полностью очищаем предыдущий аудио объект
            if (audio) {
                audio.pause();
                audio.src = '';
                audio = null;
            }

            // Создаем новый аудио объект
            audio = new Audio();
            audio.crossOrigin = 'anonymous';

            // Обработчики событий
            audio.addEventListener('loadstart', () => {
                updateStatus('connecting', 'Подключение к серверу...');
            });

            audio.addEventListener('canplay', () => {
                updateStatus('connecting', 'Буферизация...');
            });

            audio.addEventListener('playing', () => {
                isPlaying = true;
                isConnecting = false;
                playBtn.textContent = '🔴 В эфире';
                updateStatus('playing', 'Живое вещание 104.8 FM');
            });

            audio.addEventListener('waiting', () => {
                if (isPlaying || isConnecting) {
                    updateStatus('connecting', 'Буферизация...');
                }
            });

            audio.addEventListener('pause', () => {
                if (!isConnecting) {
                    stopPlay();
                }
            });

            audio.addEventListener('ended', () => {
                stopPlay();
            });

            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                isConnecting = false;
                isPlaying = false;
                playBtn.textContent = '▶ Подключиться';
                updateStatus('error', 'Ошибка подключения', 'error');
                setTimeout(() => {
                    updateStatus('ready', 'Попробуйте ещё раз');
                }, 2000);
                audio = null;
            });

            // Устанавливаем источник и запускаем
            audio.src = '/stream';
            audio.load();

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.error('Play error:', err);
                    isConnecting = false;
                    updateStatus('error', 'Ошибка воспроизведения', 'error');
                    setTimeout(() => {
                        updateStatus('ready', 'Готов к прослушиванию');
                        playBtn.textContent = '▶ Подключиться';
                    }, 2000);
                });
            }
        }

        // Модальное окно
        function openModal() {
            radioCard.classList.add('blur-active');
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            radioCard.classList.remove('blur-active');
        }

        // Обработчики
        playBtn.addEventListener('click', startPlay);
        aboutBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Очистка при закрытии страницы
        window.addEventListener('beforeunload', () => {
            if (audio) {
                audio.pause();
                audio.src = '';
            }
        });

        // Инициализация
        updateStatus('ready', 'Готов к прослушиванию');
    })();
</script>
</body>
</html>
