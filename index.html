<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уведомления</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
}

.content {
    padding: 40px;
    color: white;
}

.notifications {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.notification {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 15px 30px rgba(0,0,0,.2);
    animation: slideIn .3s ease forwards;
    transform: translateX(100%);
}

@keyframes slideIn {
    to { transform: translateX(0); }
}

.notification-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: .9rem;
    margin-bottom: 6px;
}

.notification-body {
    padding: 14px;
    color: white;
}

.notification-text {
    font-size: .9rem;
    line-height: 1.4;
}

.close {
    cursor: pointer;
    font-weight: bold;
}

.time {
    font-size: .75rem;
    opacity: .8;
}
</style>
</head>

<body>

<div class="content">
    <h1>🚀 Тестовый проект</h1>
    <p>Уведомления появляются в правом нижнем углу.</p>
</div>

<div class="notifications" id="notifications"></div>

<script>
class Notifications {

    constructor() {
        this.container = document.getElementById("notifications");
        this.displayed = new Map();      // что уже показано
        this.hidden = new Set();         // что закрыто пользователем
        this.interval = 10000;
        this.init();
    }

    async init() {
        await this.fetchInitial();
        setInterval(() => this.fetchUpdates(), this.interval);
    }

    // ---------- Первая загрузка ----------
    async fetchInitial() {
        const res = await fetch("/api/notifications");
        const data = await res.json();

        data.notifications.forEach(n => {
            if (!this.hidden.has(n.id)) {
                this.addNotification(n, false);
            }
        });
    }

    // ---------- Только новые ----------
    async fetchUpdates() {
        const res = await fetch("/api/notifications");
        const data = await res.json();

        data.notifications.forEach(n => {
            if (!this.displayed.has(n.id) && !this.hidden.has(n.id)) {
                this.addNotification(n, true);
            }
        });
    }

    addNotification(n, highlight) {
        const el = this.createElement(n);

        if (highlight) {
            el.style.boxShadow = "0 0 0 3px white";
            setTimeout(() => el.style.boxShadow = "", 2000);
        }

        this.container.prepend(el);
        this.displayed.set(n.id, el);
    }

    createElement(n) {
        const wrapper = document.createElement("div");
        wrapper.className = "notification";

        const colors = n.color || ["#4F46E5","#818CF8"];

        wrapper.innerHTML = `
            <div class="notification-body"
                 style="background:linear-gradient(135deg,${colors[0]},${colors[1]})">
                <div class="notification-header">
                    <span>${n.user}</span>
                    <span class="time">${this.formatTime(n.timestamp)}</span>
                    <span class="close">×</span>
                </div>
                <div class="notification-text">${n.text}</div>
            </div>
        `;

        // Закрытие
        wrapper.querySelector(".close").onclick = (e) => {
            e.stopPropagation();
            this.hidden.add(n.id);
            this.displayed.delete(n.id);
            wrapper.remove();
        };

        return wrapper;
    }

    formatTime(ts) {
        const d = new Date(ts);
        const now = new Date();
        const diff = Math.floor((now - d) / 60000);

        if (diff < 1) return "только что";
        if (diff < 60) return diff + " мин назад";

        return d.getHours().toString().padStart(2,"0") + ":" +
               d.getMinutes().toString().padStart(2,"0");
    }
}

window.onload = () => new Notifications();
</script>

</body>
</html>
