<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Аудио трансляция</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-8">

  <h1 class="text-5xl font-bold mb-8 text-gray-800">Аудио трансляция</h1>

  <div class="w-full max-w-xl bg-white shadow-lg rounded-xl p-6 text-center">
    <audio id="audioPlayer" controls autoplay class="w-full rounded-lg shadow mb-4" preload="auto" crossorigin="anonymous">
      <source src="/stream" type="audio/mpeg" />
      Ваш браузер не поддерживает элемент audio.
    </audio>

    <div class="flex items-center justify-center space-x-4 mt-4">
      <button id="playBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition duration-200">Play</button>
      <button id="pauseBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 transition duration-200">Pause</button>
      <button id="reloadBtn" class="px-4 py-2 bg-gray-600 text-white rounded-lg shadow hover:bg-gray-700 transition duration-200">Reload</button>
    </div>
    <p id="status" class="mt-4 text-gray-500 text-sm">Статус: ожидание данных...</p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
