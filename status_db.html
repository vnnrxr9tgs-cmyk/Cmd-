<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус БД</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            font-size: 2.5em;
            font-weight: 300;
        }
        h1::before {
            content: "📊 ";
        }
        .db-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .db-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .db-card h2 {
            color: #667eea;
            margin-top: 0;
            font-size: 1.8em;
            font-weight: 500;
        }
        .db-card h2::before {
            content: "🗄️ ";
        }
        .date {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }
        details {
            margin-top: 15px;
        }
        summary {
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #007bff;
            transition: background-color 0.3s ease;
            list-style: none;
        }
        summary:hover {
            background: #e9ecef;
        }
        summary::marker {
            display: none;
        }
        summary::before {
            content: "▶️ ";
            transition: transform 0.3s ease;
        }
        details[open] summary::before {
            content: "🔽 ";
        }
        pre {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #dee2e6;
        }
        .no-data {
            color: #dc3545;
            font-style: italic;
            font-size: 16px;
            padding: 20px;
            background: #f8d7da;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }
        a.back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        a.back:hover {
            background: linear-gradient(135deg, #5a6268 0%, #343a40 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Статус Баз Данных MySQL</h1>
        {% for db_name, data in db_status.items() %}
        <div class="db-card">
            <h2>{{ db_name.upper() }}</h2>
            {% if data %}
                <div class="date">Последнее обновление: {{ data.date.strftime('%Y-%m-%d %H:%M:%S') }}</div>
                <details>
                    <summary>Показать статус</summary>
                    <pre>{{ data.content }}</pre>
                </details>
            {% else %}
                <div class="no-data">Файл статуса не найден.</div>
            {% endif %}
        </div>
        {% endfor %}
        <a class="back" href="/">Вернуться на главную</a>
    </div>
</body>
</html>
