<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>HF Digest</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f1115;
            color: #e6e6e6;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 28px;
        }

        h1 {
            font-size: 32px;
        }

        .card {
            display: block;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 14px;
            background: #171a21;
            border: 1px solid #222;
            text-decoration: none;
            color: inherit;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #4fc3f7;
            background: #1c212b;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .meta {
            font-size: 14px;
            color: #aaa;
            line-height: 1.6;
        }

        .meta span {
            color: #4fc3f7;
        }

        .date {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">📻</div>
        <h1>HF Digest</h1>
    </div>

    {% for item in news %}
    <a href="/news/{{ item.id }}" class="card">
        <div class="title">{{ item.title }}</div>

        <div class="meta">
            Анализ и перевод новостей с языка <span>{{ item.language.upper() }}</span>

            Статей: <span>{{ item.articles_count }}</span> •
            Символов: <span>{{ item.chars_count }}</span>
        </div>

        <div class="date">{{ item.date }}</div>
    </a>
    {% endfor %}

</div>

</body>
</html>
