<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ data.original_filename }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f1115;
            color: #e6e6e6;
        }

        .container {
            max-width: 820px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .meta {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .lang {
            margin-left: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: #1e2a36;
            color: #4fc3f7;
            font-size: 12px;
        }

        .content p {
            background: #171a21;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 18px 20px;
            margin: 20px 0;

            line-height: 1.7;
            font-size: 16px;
            text-align: justify;
        }

        .content strong {
            display: block;
            font-size: 17px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        a {
            color: #4fc3f7;
            text-decoration: none;
        }

        .back {
            display: inline-block;
            margin-top: 40px;
            color: #aaa;
        }

        .back:hover {
            color: #fff;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>{{ data.original_filename.replace('.docx', '') }}</h1>

    <div class="meta">
        {{ data.processed_at[:16] }}
        <span class="lang">{{ data.language.upper() }}</span>
    </div>

    <div class="content">
        {{ html_text | safe }}
    </div>

    <a href="/" class="back">← Назад</a>
</div>

</body>
</html>
