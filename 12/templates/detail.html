<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ data.original_filename }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f9fbfd;
            color: #1e2f3e;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 860px;
            margin: 48px auto;
            padding: 0 24px;
        }

        /* стиль для заголовка */
        h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #1a3b4f;
            margin-bottom: 12px;
            line-height: 1.3;
            border-left: 4px solid #7ab3c8;
            padding-left: 20px;
        }

        /* мета-информация: дата, язык */
        .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            color: #6c86a3;
            font-size: 14px;
            font-weight: 450;
            margin-bottom: 36px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e4edf2;
        }

        .lang {
            background: #eef4fa;
            color: #2c6e9e;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2px;
            margin-left: 0;
        }

        /* контентная область — улучшенное чтение */
        .content {
            font-size: 17px;
            color: #2a3e52;
        }

        /* основной блок текста (параграфы) */
        .content p {
            background: #ffffff;
            border: 1px solid #e6edf2;
            border-radius: 20px;
            padding: 24px 28px;
            margin: 28px 0;
            line-height: 1.65;
            font-size: 16px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.2s ease;
        }

        .content p:hover {
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
        }

        /* стиль для strong внутри контента — мягкий акцент */
        .content strong {
            display: block;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #1c5777;
            letter-spacing: -0.2px;
            background: #f4f9fe;
            padding: 4px 0 4px 12px;
            border-left: 3px solid #7ab3c8;
        }

        /* дополнительные элементы внутри контента: списки, цитаты и т.д. */
        .content ul, .content ol {
            margin: 20px 0 20px 24px;
            padding-left: 8px;
        }

        .content li {
            margin: 8px 0;
            line-height: 1.55;
        }

        .content blockquote {
            background: #f4f8fc;
            border-left: 4px solid #9bc0d4;
            padding: 16px 24px;
            margin: 24px 0;
            border-radius: 16px;
            font-style: normal;
            color: #2c4b66;
        }

        .content code {
            background: #eff3f6;
            padding: 2px 6px;
            border-radius: 8px;
            font-family: 'SF Mono', monospace;
            font-size: 0.9em;
            color: #1f6392;
        }

        .content pre {
            background: #f3f6fa;
            padding: 16px 20px;
            border-radius: 16px;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #e2ecf3;
        }

        /* ссылки внутри контента */
        .content a {
            color: #2c7da0;
            text-decoration: none;
            border-bottom: 1px solid #cde1ec;
            transition: color 0.2s, border-color 0.2s;
        }

        .content a:hover {
            color: #155f82;
            border-bottom-color: #2c7da0;
        }

        /* кнопка назад — светлая, элегантная */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            padding: 10px 18px;
            background: #ffffff;
            border: 1px solid #dce6ed;
            border-radius: 60px;
            color: #3d6b8c;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .back:hover {
            background: #f3f9ff;
            border-color: #bdd4e2;
            color: #1e5a7a;
            transform: translateX(-3px);
            box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.05);
        }

        /* адаптация для мобильных */
        @media (max-width: 680px) {
            .container {
                padding: 0 20px;
                margin: 32px auto;
            }
            h1 {
                font-size: 26px;
                padding-left: 16px;
            }
            .content p {
                padding: 18px 20px;
                margin: 20px 0;
            }
            .meta {
                margin-bottom: 28px;
            }
        }

        /* тонкая настройка для типографики */
        .content h2, .content h3 {
            color: #1e4d6b;
            font-weight: 600;
            margin: 28px 0 12px 0;
            letter-spacing: -0.2px;
        }

        .content h2 {
            font-size: 22px;
        }

        .content h3 {
            font-size: 19px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>{{ data.original_filename.replace('.docx', '') }}</h1>

    <div class="meta">
        <span>📅 {{ data.processed_at[:16] }}</span>
        <span class="lang">{{ data.language.upper() }}</span>
    </div>

    <div class="content">
        {{ html_text | safe }}
    </div>

    <a href="/" class="back">← Назад</a>
</div>

</body>
</html>
